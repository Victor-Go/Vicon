name: Release

# Publishes to npm when you create a GitHub Release (tag like v0.1.1).
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1

      - name: Tag must match package.json version
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "${{ github.event.release.tag_name }}" ] || { echo "Tag ${{ github.event.release.tag_name }} does not match package.json ($v)"; exit 1; }

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Publish vicon-avatars
        run: npm publish

      - name: Build and publish vicon-avatars-angular
        run: |
          npm --prefix angular ci
          npm run build:angular
          npm publish angular/dist
